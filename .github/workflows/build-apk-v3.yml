name: 🍒 Build DesiFlix APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📋 Setup Android project from scratch
        run: |
          # Copy HTML into assets
          mkdir -p android/app/src/main/assets
          cp desflix-app.html android/app/src/main/assets/desflix-app.html

          # Fix build.gradle to use compatible syntax
          cat > android/build.gradle << 'GRADLE'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
GRADLE

          cat > android/settings.gradle << 'GRADLE'
rootProject.name = "DesiFlix"
include ':app'
GRADLE

          cat > android/app/build.gradle << 'GRADLE'
apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    namespace 'com.desiflix.app'

    defaultConfig {
        applicationId "com.desiflix.app"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
}
GRADLE

          cat > android/gradle.properties << 'GRADLE'
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m
GRADLE

          cat > android/gradle/wrapper/gradle-wrapper.properties << 'GRADLE'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
GRADLE

      - name: 🔧 Download real Gradle wrapper
        run: |
          cd android
          curl -L "https://services.gradle.org/distributions/gradle-7.5-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-7.5/bin/gradle wrapper --gradle-version 7.5
          chmod +x gradlew

      - name: 🏗️ Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DesiFlix-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
